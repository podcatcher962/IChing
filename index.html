 {id:1,sym:'䷀',zh:'乾为天',en:'The Creative',up:'乾',lo:'乾',gc:'元亨利贞。',vi:'大吉大利，宜积极进取，自强不息。天行健，君子以自强不息。',ei:'Great success and perseverance. The superior man never ceases to strengthen himself.',ls:[{l:'初九：潜龙勿用。',vi:'时机未到，耐心等待。',el:'Hidden dragon. Do not act.'},{l:'九二：见龙在田，利见大人。',vi:'才华初显，宜寻贵人。',el:'Dragon appears in the field. Seek the great man.'},{l:'九三：君子终日乾乾，夕惕若厉，无咎。',vi:'勤勉谨慎，化险为夷。',el:'Alert all day. No blame.'},{l:'九四：或跃在渊，无咎。',vi:'进退自如，审时度势。',el:'Wavering flight over the abyss. No blame.'},{l:'九五：飞龙在天，利见大人。',vi:'大展宏图，如日中天。',el:'Flying dragon in heaven. Great success.'},{l:'上九：亢龙有悔。',vi:'过犹不及，知进退。',el:'Arrogant dragon will regret.'}]},
 {id:2,sym:'䷁',zh:'坤为地',en:'The Receptive',up:'坤',lo:'坤',gc:'元亨，利牝马之贞。',vi:'柔顺守正，以静制动。地势坤，君子以厚德载物。',ei:'Sublime success. The mare brings good fortune. The superior man carries all things with great virtue.',ls:[{l:'初六：履霜，坚冰至。',vi:'见微知著，防患未然。',el:'Tread on frost. Solid ice comes.'},{l:'六二：直方大，不习无不利。',vi:'正直包容，自然顺遂。',el:'Straight, square, great. All is favorable.'},{l:'六三：含章可贞，或从王事，无成有终。',vi:'才德内敛，守职尽责。',el:'Hidden excellence. Serve with care.'},{l:'六四：括囊，无咎无誉。',vi:'谨言慎行，不求褒贬。',el:'Tied sack. No blame, no praise.'},{l:'六五：黄裳，元吉。',vi:'中庸谦和，大吉。',el:'Yellow garment. Supreme good fortune.'},{l:'上六：龙战于野，其血玄黄。',vi:'物极必反，避免极端。',el:'Dragons fight in the wild. Blood flows.'}]},
 {id:3,sym:'䷂',zh:'水雷屯',en:'Difficulty at Beginning',up:'坎',lo:'震',gc:'元亨利贞。勿用有攸往，利建侯。',vi:'万事开头难，宜稳扎稳打，建立根基。',ei:'Great success through perseverance. Do not rush. Build foundations.',ls:[{l:'初九：磐桓，利居贞。',vi:'固守待时，稳建基业。',el:'Hesitation. Stay grounded.'},{l:'六二：屯如邅如，乘马班如。',vi:'虽有障碍，贵人相助。',el:'Difficult progress. Not a robber, a suitor.'},{l:'六三：即鹿无虞，惟入于林中。',vi:'盲目冒进不如放弃。',el:'Hunting without a guide. Better to desist.'},{l:'六四：乘马班如，求婚媾，往吉。',vi:'主动求援，转机将至。',el:'Seek alliance. Good fortune ahead.'},{l:'九五：屯其膏，小贞吉。',vi:'施惠宜小不宜大。',el:'Store fat. Small steps blessed.'},{l:'上六：乘马班如，泣血涟如。',vi:'陷入困境需冷静。',el:'Horses halt. Tears of blood.'}]},

function calcBaziAssist(y,m,d,h){
  try{
    if(typeof Solar==='undefined')return null;
    const solar=Solar.fromYmdHms(y,m,d,h,0,0), lunar=solar.getLunar();
    const gz=[lunar.getYearInGanZhi(),lunar.getMonthInGanZhi(),lunar.getDayInGanZhi(),lunar.getTimeInGanZhi()];
    const dayStem=gz[2][0],dayBranch=gz[2][1], si=BZ_STEMS.indexOf(dayStem);
    const elems={木:0,火:0,土:0,金:0,水:0};
    gz.forEach(v=>{const a=BZ_STEMS.indexOf(v[0]),b=BZ_BRANCHES.indexOf(v[1]);if(a>=0)elems[BZ_S_ELEM[a]]++;if(b>=0)elems[BZ_B_ELEM[b]]++;});
    const order=['木','火','土','金','水'], sorted=order.slice().sort((a,b)=>elems[b]-elems[a]);
    return{date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')} ${h}:00`,gz,dayStem,dayBranch,dayElem:BZ_S_ELEM[si],elems,strongest:sorted[0],weakest:sorted[4],shengxiao:lunar.getYearShengXiao()};

}

function startToss(){
  const q=document.getElementById('question').value.trim();
  const zi=document.getElementById('zi').value.trim();
  const bazi=readBaziAssist();if(bazi==='invalid')return;
  state={question:q,zi:zi,lines:[],step:0,hexagram:null,changed:null,changingIdx:[],bazi};
  document.getElementById('inputPage').style.display='none';
  document.getElementById('resultPage').style.display='none';
  document.getElementById('tossPage').style.display='block';
  updateTossUI();
}

function quickToss(){
  const q=document.getElementById('question').value.trim();
  const zi=document.getElementById('zi').value.trim();
  const bazi=readBaziAssist();if(bazi==='invalid')return;
  state={question:q,zi:zi,lines:[],step:0,hexagram:null,changed:null,changingIdx:[],bazi};
  for(let i=0;i<6;i++){const s=Math.floor(Math.random()*4)+6;state.lines.push({value:s,label:LINE_LABELS[s]});if(s===6||s===9)state.changingIdx.push(i);}
  state.step=6;findHexagram();
  document.getElementById('inputPage').style.display='none';
  document.getElementById('tossPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
  renderResult();saveHistory();
}

function tossCoin(){
  if(state.step>=6)return;
  const coins=[document.getElementById('coin1'),document.getElementById('coin2'),document.getElementById('coin3')];
  coins.forEach(c=>c.classList.add('tossing'));
  setTimeout(()=>{
    let sum=0;coins.forEach(c=>{const v=Math.random()<0.5?2:3;sum+=v;c.textContent=v===3?'🪙':'⚫';c.className='coin '+(v===3?'heads':'tails');});
    state.lines.push({value:sum,label:LINE_LABELS[sum]});
    if(sum===6||sum===9)state.changingIdx.push(state.lines.length-1);
    state.step++;
    if(state.step>=6){
      findHexagram();
      setTimeout(()=>{
        document.getElementById('tossPage').style.display='none';
        document.getElementById('resultPage').style.display='block';
        renderResult();saveHistory();
      },500);
    }
    updateTossUI();
  },600);
}

function findHexagram(){
  const lines=state.lines.map(l=>l.value);
  const changed=state.lines.map(l=>{if(l.value===6)return 7;if(l.value===9)return 8;return l.value;});
  const tri=(ls,st)=>{const a=ls[st],b=ls[st+1],c=ls[st+2];const p=(a===7||a===9)?1:0,q=(b===7||b===9)?1:0,r=(c===7||c===9)?1:0;return(r<<2)|(q<<1)|p;};
  const TN=['坤','震','坎','兑','艮','离','巽','乾'];
  const lo=TN[tri(lines,0)],hi=TN[tri(lines,3)];
  state.hexagram=HEXAGRAMS.find(h=>h.lo===lo&&h.up===hi)||HEXAGRAMS[0];
  if(state.changingIdx.length>0){const clo=TN[tri(changed,0)],chi=TN[tri(changed,3)];state.changed=HEXAGRAMS.find(h=>h.lo===clo&&h.up===chi)||state.hexagram;}
  else state.changed=null;
}

function updateTossUI(){
  document.getElementById('roundInfo').textContent='第 '+Math.min(state.step+1,6)+' / 6 次';
  let html='';
  for(let i=state.lines.length-1;i>=0;i--){const l=state.lines[i],v=l.value,ch=v===6||v===9;html+=`<div class="hex-line${ch?' changing':''}"><span class="lbl">${6-i}</span><span class="bar">${v===7||v===9?'━━━━━':'━ ━'}</span><span style="font-size:10px;color:var(--dim)">${l.label}</span></div>`;}
  document.getElementById('lineDisplay').innerHTML=html||('<div style="color:var(--dim);font-size:11px">'+{zh:'等待摇卦...',en:'Waiting for toss...'}[lang]+'</div>');
}

function ceziAnalysis(text,h,l){
  if(!text||!text.trim())return null;
  const t=text.trim();
  const hash=t.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const pool=CZ_POOL[hash%CZ_POOL.length];
  // Detect radicals
  const rads=[];
  for(const[k,elem]of Object.entries(RADICAL)){if(t.includes(k)&&!rads.some(r=>r.e===elem))rads.push({r:k,e:elem});}
  // Number analysis
  const isNum=!isNaN(t)&&t.length>0;
  const nv=isNum?parseInt(t):null;
  let numInfo='';
  if(nv!==null){
    const ne=['水','木','木','火','火','土','土','金','金','水'][nv%10];
    numInfo=l==='zh'?`数字${nv}数理属${ne}，${HETU[ne]?`对应河图数${HETU[ne][0]}与${HETU[ne][1]}`:''}。`:`Number ${nv} belongs to ${ne} element.`;
  }
  // Element interaction with hexagram
  const uElem=TRI_ELEM[h.up]||'',lElem=TRI_ELEM[h.lo]||'';
  let interact='';
  if(rads.length>0){
    const re=rads[0].e;
    interact=l==='zh'?`字中「${rads[0].r}」属${re}，与卦象${uElem+lElem}${re===uElem||re===lElem?'同气，相得益彰。':'各有属性，互为补充。'}`:`Radical "${rads[0].r}" (${re}) ${re===uElem||re===lElem?'resonates with the hexagram.':'complements the hexagram.'}`;
  }
  return{text:t,pool,rads,isNum,numInfo,interact};
}

// ========== THEME ==========
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const b=document.getElementById('btnTheme');if(b)b.textContent=t==='light'?'☀️':'🌙';
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  applyTheme(cur);try{localStorage.setItem('ichingTheme',cur);}catch(e){}
  showT(cur==='light'?'☀️ 已切换亮色主题':'🌙 已切换暗色主题');

// ========== HISTORY ==========
function saveHistory(){
  try{
    const h=state.hexagram;if(!h)return;
    const rec={t:Date.now(),q:state.question,zi:state.zi,hex:h.zh,hexEn:h.en,sym:h.sym,lines:state.lines.map(l=>l.value),chg:state.changed&&state.changed!==h?{sym:state.changed.sym,zh:state.changed.zh}:null,bazi:state.bazi?{dayStem:state.bazi.dayStem,dayElem:state.bazi.dayElem}:null};
    let arr=JSON.parse(localStorage.getItem('ichingHistory')||'[]');
    arr.unshift(rec);if(arr.length>30)arr=arr.slice(0,30);
    localStorage.setItem('ichingHistory',JSON.stringify(arr));
  }catch(e){}
}
function openHistory(){
  let arr=[];try{arr=JSON.parse(localStorage.getItem('ichingHistory')||'[]');}catch(e){}
  if(arr.length===0){showT(lang==='zh'?'暂无历史记录':'No history yet');return;}
  const l=lang;
  let html=`<h2>🕘 ${l==='zh'?'历史卦象':'History'}</h2><div style="max-height:50vh;overflow-y:auto">`;
  arr.forEach((r,i)=>{
    const d=new Date(r.t);
    html+=`<div onclick="loadHistory(${i})" style="padding:10px;border:1px solid var(--bdr);margin:6px 0;cursor:pointer;background:var(--inp)">`;
    html+=`<div style="font-size:16px;color:var(--gold)">${r.sym} ${l==='zh'?r.hex:r.hexEn}${r.chg?` → ${r.chg.sym} ${r.chg.zh}`:''}</div>`;
    html+=`<div style="font-size:10px;color:var(--dim);margin-top:4px">${d.toLocaleString()}${r.q?' · '+r.q:''}</div>`;
    html+=`</div>`;
  });
  html+=`</div><div style="margin-top:10px;text-align:center"><button class="btn muted sm" onclick="clearHistory()">🗑 ${l==='zh'?'清空历史':'Clear'}</button></div>`;
  document.getElementById('modalBox').innerHTML=`<button class="modal-close" onclick="closeM()">✕</button>${html}`;
  document.getElementById('modalOverlay').classList.add('show');
}
function loadHistory(i){
  let arr=[];try{arr=JSON.parse(localStorage.getItem('ichingHistory')||'[]');}catch(e){}
  const r=arr[i];if(!r)return;
  state.hexagram=HEXAGRAMS.find(h=>h.zh===r.hex)||HEXAGRAMS[0];
  state.question=r.q||'';state.zi=r.zi||'';
  state.lines=r.lines.map(v=>({value:v,label:LINE_LABELS[v]}));
  state.changingIdx=[];r.lines.forEach((v,idx)=>{if(v===6||v===9)state.changingIdx.push(idx);});
  state.changed=null;
  if(r.chg){const ch=HEXAGRAMS.find(h=>h.zh===r.chg.zh);if(ch&&ch!==state.hexagram)state.changed=ch;}
  state.bazi=r.bazi||null;
  closeM();
  document.getElementById('inputPage').style.display='none';
  document.getElementById('tossPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
  renderResult();
}
function clearHistory(){try{localStorage.removeItem('ichingHistory');}catch(e){}closeM();showT(lang==='zh'?'🗑 历史已清空':'🗑 History cleared');}

// ========== AUTO TOSS ==========
let autoTimer=null;
function autoToss(){
  if(state.step>=6)return;
  if(autoTimer)return;
  showT(lang==='zh'?'🎲 自动摇卦中...':'🎲 Auto casting...');
  autoTimer=setInterval(()=>{tossCoin();if(state.step>=6){clearInterval(autoTimer);autoTimer=null;}},650);
}

let soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  const bgm = document.getElementById('bgm');
  if(soundOn){ bgm.play().catch(()=>{}); }
  else { bgm.pause(); }
  document.getElementById('btnSound').className = soundOn ? 'active' : '';
}
(function(){
  const bgm = document.getElementById('bgm');
  if(!bgm) return;
  bgm.volume = 0.25;
  bgm.play().catch(()=>{});
  document.getElementById('btnSound').className = 'active';
  document.addEventListener('pointerdown', function(){
    if(soundOn && bgm.paused) bgm.play().catch(()=>{});
  });
})();
